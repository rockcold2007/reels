<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>限動預告圖產生器</title>
<style>
:root{--bg:#faf6fb;--fg:#2a1736;--mut:#7a6585;--line:#e3d5ea;--acc:#c0409a;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1022;--fg:#f3e8f7;--mut:#a893b3;--line:#3a2848;--acc:#e56cc0;--card:#25162f}}
:root[data-theme="dark"]{--bg:#1a1022;--fg:#f3e8f7;--mut:#a893b3;--line:#3a2848;--acc:#e56cc0;--card:#25162f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.5}
main{max-width:1040px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
@media(min-width:820px){main{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.side{position:sticky;top:16px}}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:24px 0 8px}
p.s,.hint{margin:0 0 12px;color:var(--mut);font-size:13px}
label.l{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input[type=text],select{width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font-size:15px}
input[type=range]{width:100%;accent-color:var(--acc)}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;cursor:pointer}
.drop:hover{border-color:var(--acc)}
input[type=file]{display:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cp{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mut);gap:4px}
.cp label{display:flex;gap:4px;align-items:center}
input[type=color]{width:56px;height:40px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px;cursor:pointer}
.sw{display:flex;border-radius:10px;overflow:hidden;border:2px solid var(--line);cursor:pointer;padding:0;background:none}
.sw i{display:block;width:18px;height:30px}.sw:hover{border-color:var(--acc)}
button.b{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font-size:14px;cursor:pointer}
button.p{padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:15px;font-weight:700;cursor:pointer;flex:1}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(min-width:520px){.gal{grid-template-columns:repeat(5,1fr)}}
.th{border:2px solid var(--line);border-radius:10px;background:var(--card);padding:4px;cursor:pointer;color:var(--fg);font-size:12px}
.th.on{border-color:var(--acc)}
.th canvas{width:100%;aspect-ratio:9/16;border-radius:6px;display:block;margin-bottom:3px}
canvas.m{width:100%;max-width:340px;aspect-ratio:9/16;border-radius:14px;border:1px solid var(--line);display:block;margin:0 auto}
#nm{text-align:center;font-size:13px;color:var(--mut);margin:8px 0}
#out{display:none;margin-top:18px}
.og{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:8px}
.og img{width:100%;border-radius:10px;display:block}
.oi{display:grid;gap:6px}.oi .hint{margin:0;min-height:18px;text-align:center}button.dl{flex:none;width:100%;padding:10px}button.dl:disabled{opacity:.6}
</style>
</head>
<body>
<main>
<section>
<h1>IG 限動預告圖產生器</h1>
<p class="s">上傳截圖，選一種固定版面，或自己組合。顏色可鎖定、隨機、自動檢查對比。</p>
<label class="drop" for="f" id="dz">點此選擇影片截圖／封面圖</label>
<input type="file" id="f" accept="image/*">
<label class="l">標籤</label><input type="text" id="tag" value="新影片上線">
<label class="l">標題</label><input type="text" id="t1" value="dance cover">
<label class="l">副標</label><input type="text" id="t2" value="KPOP IN PUBLIC">
<label class="l">底部提示（留空則不顯示）</label><input type="text" id="t3" value="點下方連結看完整影片">
<h2>顏色</h2>
<div class="row">
<div class="cp"><input type="color" id="cbg"><label><input type="checkbox" id="lbg">鎖定背景</label></div>
<div class="cp"><input type="color" id="cac"><label><input type="checkbox" id="lac">鎖定強調</label></div>
<div class="cp"><input type="color" id="ctx"><label><input type="checkbox" id="ltx">鎖定文字</label></div>
</div>
<div class="row" style="margin-top:10px">
<button class="b" id="rnd">隨機配色</button><button class="b" id="pick">從圖片取色</button><button class="b" id="fix">修正對比</button>
<label class="hint" style="margin:0"><input type="checkbox" id="auto" checked> 隨機／取色後自動修正</label>
</div>
<p class="hint" id="bd" style="margin-top:8px"></p>
<div class="row" id="pal"></div>
<h2>20 種固定版面</h2>
<div class="gal" id="gal"></div>
<h2>自由組合</h2>
<p class="hint">改動任何一項，就會變成「自訂組合」。</p>
<div id="ctl"></div>
<label class="hint" style="display:block;margin-top:10px"><input type="checkbox" id="pl" checked> 顯示播放鍵</label>
<button class="b" id="rl" style="width:100%;margin-top:6px">隨機排版 12 種</button>
<div class="gal" id="rg" style="margin-top:10px"></div>
</section>
<section class="side">
<canvas class="m" id="main" width="540" height="960"></canvas>
<div id="nm"></div>
<div class="row">
<button class="p" id="e1">輸出目前版面</button>
<button class="p" id="e2" style="background:var(--fg);color:var(--bg)">輸出全部 20 種</button>
</div>
<div id="out"><p class="hint" id="dlh" style="margin-top:12px">按各張圖下方的「下載 PNG」即可儲存。</p><div class="og" id="og"></div></div>
</section>
</main>
<script>

var cfg=mk(0),sel=0,th=[],rt=[],pend=0;

var CTL=[['bg','背景',[['blur','模糊圖'],['solid','純色'],['grad','漸層'],['acc','強調色底']]],['frame','圖片容器',[['card','圓角卡片'],['player','播放器'],['polar','拍立得'],['circle','圓形'],['arch','拱門'],['band','寬幅影格'],['top','上半滿版'],['full','全滿版']]],['tpos','文字位置',[['below','圖在上、字在下'],['above','字在上、圖在下'],['bottom','文字靠底']]],['al','對齊',[['left','靠左'],['center','置中']]],['deco','裝飾',[['none','無'],['circles','圓形色塊'],['offset','偏移色塊'],['stripes','斜條紋']]]];
var SLD=[['size','圖片大小',.5,1.15,.01],['r','圓角',0,90,1],['rot','旋轉角度',-10,10,1],['ty','標題字級',50,150,2],['dy','上下位移',-200,200,5]];
function syncCtl(){CTL.forEach(function(q){$('s_'+q[0]).value=cfg[q[0]]});SLD.forEach(function(q){$('r_'+q[0]).value=cfg[q[0]];$('v_'+q[0]).textContent=cfg[q[0]]});$('pl').checked=!!cfg.play}
function custom(){sel=-1;draw()}
function build(){var h='';CTL.forEach(function(q){h+='<label class="l">'+q[1]+'</label><select id="s_'+q[0]+'">'+q[2].map(function(v){return'<option value="'+v[0]+'">'+v[1]+'</option>'}).join('')+'</select>'});
SLD.forEach(function(q){h+='<label class="l">'+q[1]+' <b id="v_'+q[0]+'"></b></label><input type="range" id="r_'+q[0]+'" min="'+q[2]+'" max="'+q[3]+'" step="'+q[4]+'">'});$('ctl').innerHTML=h;
CTL.forEach(function(q){$('s_'+q[0]).onchange=function(){cfg[q[0]]=this.value;custom()}});
SLD.forEach(function(q){$('r_'+q[0]).oninput=function(){cfg[q[0]]=+this.value;$('v_'+q[0]).textContent=this.value;custom()}});
$('pl').onchange=function(){cfg.play=this.checked?1:0;custom()};
PR.forEach(function(p,i){var b=document.createElement('button');b.className='th';b.innerHTML='<canvas width="162" height="288"></canvas>'+p[0];b.onclick=function(){cfg=mk(i);sel=i;syncCtl();draw()};$('gal').appendChild(b);th.push(b)});
PAL.forEach(function(q){var b=document.createElement('button');b.className='sw';b.title=q[0];b.innerHTML='<i style="background:'+q[1]+'"></i><i style="background:'+q[2]+'"></i><i style="background:'+q[3]+'"></i>';b.onclick=function(){setCols(q[1],q[2],q[3])};$('pal').appendChild(b)})}
function pk(a){return a[Math.floor(Math.random()*a.length)]}
function rcfg(){var f=pk(['card','card','player','polar','circle','arch','band','top','full']),g=Object.assign({},D,{frame:f,bg:pk(['blur','solid','grad','acc']),al:pk(['left','center']),deco:pk(['none','circles','offset','stripes']),tpos:pk(['below','above','bottom']),ty:pk([64,72,84,100,120]),size:pk([.8,.9,1]),r:pk([12,36,60]),rot:pk([-4,-3,0,0,0,3,4])});
if(f=='full'){g.tpos='bottom';g.deco='none'}if(f=='top'||f=='band')g.rot=0;if(f=='top'){g.tpos='below';g.deco='none'}if(f=='band'&&g.deco=='offset')g.deco='none';if(f=='circle'||f=='arch')g.al='center';return g}
$('rl').onclick=function(){var e=$('rg');e.innerHTML='';rt=[];for(var i=0;i<12;i++){(function(){var g=rcfg(),b=document.createElement('button');b.className='th';b.innerHTML='<canvas width="162" height="288"></canvas>隨機';e.appendChild(b);rt.push({c:b.firstChild,g:g});b.onclick=function(){cfg=Object.assign({},g);syncCtl();custom()}})()}draw()};
$('rnd').onclick=function(){var h=LK.acc?hue(o.acc):LK.bg?hue(o.bg):Math.random()*360,lt=Math.random()<.3;setCols(lt?hsl(h,40,92):hsl(h,45,16),hsl(h+(lt?Math.random()*60-30:120+Math.random()*120),85,lt?50:65),lt?hsl(h,45,16):'#ffffff')};
$('fix').onclick=function(){fixCol();syncCol();draw()};
['bg','acc','text'].forEach(function(k,i){$(['lbg','lac','ltx'][i]).onchange=function(){LK[k]=this.checked?1:0};$(['cbg','cac','ctx'][i]).oninput=function(){o[k]=this.value;draw()}});
['tag','t1','t2','t3'].forEach(function(i){$(i).addEventListener('input',draw)});
$('pick').onclick=function(){if(!o.img){$('dz').textContent='請先上傳圖片再取色';return}var s=document.createElement('canvas');s.width=s.height=24;var q=s.getContext('2d');cover(q,o.img,0,0,24,24);var d=q.getImageData(0,0,24,24).data,R=0,G=0,B=0,n=0,best=[128,128,128],bs=-1;for(var i=0;i<d.length;i+=4){R+=d[i];G+=d[i+1];B+=d[i+2];n++;var mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]),sc=(mx-mn)*(mx/255)*(mx>90?1:.3);if(sc>bs){bs=sc;best=[d[i],d[i+1],d[i+2]]}}
var k=Math.max(best[0],best[1],best[2]);if(k<200){var f=200/Math.max(k,1);best=best.map(function(v){return v*f})}
setCols(hex(R/n*.3,G/n*.3,B/n*.3),hex(best[0],best[1],best[2]),'#ffffff')};
$('f').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){o.img=i;$('dz').textContent='已載入：'+f.name;draw()};i.src=r.result};r.readAsDataURL(f)});
var DL=null;
if(window.claude&&claude.use)claude.use('downloads').then(function(d){DL=d}).catch(function(){});
function shot(g,nm){var c=document.createElement('canvas');c.width=1080;c.height=1920;render(c.getContext('2d'),g,1);var w=document.createElement('div');w.className='oi';var im=new Image();im.src=c.toDataURL('image/png');var b=document.createElement('button');b.className='p dl';b.textContent='下載 PNG';var m=document.createElement('div');m.className='hint';
b.onclick=function(){b.disabled=true;var fn='story-'+nm+'.png';c.toBlob(function(bl){if(!bl){m.textContent='產生失敗，請長按圖片儲存';b.disabled=false;return}
if(DL){DL.save({filename:fn,data:bl}).then(function(){m.textContent='已儲存'},function(e){m.textContent=e&&e.code=='declined'?'已取消':'下載失敗，請長按圖片儲存'}).then(function(){b.disabled=false});return}
var u=URL.createObjectURL(bl),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);m.textContent='已開始下載';b.disabled=false},'image/png')};
w.appendChild(im);w.appendChild(b);w.appendChild(m);return w}
function out(gs){var e=$('og');e.innerHTML='';gs.forEach(function(x){e.appendChild(shot(x[0],x[1]))});$('out').style.display='block';$('out').scrollIntoView({behavior:'smooth'})}
$('e1').onclick=function(){out([[cfg,sel>=0?'v'+(sel+1):'custom']])};
$('e2').onclick=function(){out(PR.map(function(_,i){return [mk(i),'v'+(i+1)]}))};
build();syncCtl();syncCol();draw();
</script>
</body>
